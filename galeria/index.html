<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imágenes - Control de Estilos</title>
    <script src="js.js"></script>
    <link rel="stylesheet" href="estilo.css">
</head>
<body onload="inicializaReferencias()">

  <h1>Galería de Imágenes</h1>
  <div class="controles">
    <button id="estilo-claro" class="">Tema Claro</button>
    <button id="estilo-oscuro" class="">Tema Oscuro</button>
    <button id="estilo-reset" class="">Restablecer</button>
  </div>
  <div id="galeria" class="">
    <div class="contenedor-imagen">
      <img src="imagenes/larry.png" alt="Imagen 1">
      <p>Este es larry, el gato de compañia</p>
    </div>
    <div class="contenedor-imagen">
      <img src="imagenes/fish-spin.gif" alt="Imagen 2">
      <p>Un pez girando que esta to guapo</p>
    </div>
    <div class="contenedor-imagen">
      <img src="imagenes/hisgreedsickensme.png" alt="Imagen 3">
      <p>Gato codicioso que tiene dos manzanas</p>
    </div>
    <div class="contenedor-imagen">
      <img src="imagenes/kirby-falling.gif" alt="Imagen 4">
      <p>Kirby cayendo una y otra vez</p>
    </div>
  </div>
  <a href="../index.html" class="botonVolver">Volver</a>
</body>
</html>
